<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ user_name }}的 BMI 紀錄 · 好好生活</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="好好生活，回到首頁">
          <span class="brand-mark" aria-hidden="true">✳</span>
          好好生活 <span class="brand-en">WELL LIVING</span>
        </a>
        <a class="back-link" href="{{ url_for('index') }}">← 回到 BMI 計算器</a>
      </header>

      <main class="history-page">
        <span class="section-number">USER HISTORY / 歷史紀錄</span>
        <h1>{{ user_name }}的<br><em>BMI 紀錄。</em></h1>
        <p class="intro">以下是此使用者歷次計算的 BMI 數值與時間。</p>

        {% if records %}
          <div class="history-list">
            {% for record in records %}
              <div class="history-row">
                <span class="history-bmi">{{ "%.1f"|format(record.bmi) }}</span>
                <span class="history-unit">BMI</span>
                <time datetime="{{ record.calculated_at }}">{{ record.calculated_at }}</time>
              </div>
            {% endfor %}
          </div>
        {% else %}
          <p class="empty-state">找不到此使用者的 BMI 紀錄。</p>
        {% endif %}
      </main>
      <footer>© 好好生活 <span>TAKE CARE, EVERY DAY.</span></footer>
    </div>
  </body>
</html>
