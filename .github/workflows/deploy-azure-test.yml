name: Deploy BMI to Azure Test Slot

on:
  push:
    branches: [dev]
    paths:
      - app.py
      - serve.py
      - web.config
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-bmi-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SLOT_NAME: test
      PYTHON_RUNTIME_VERSION: 3.14.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECTKEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGKEY }}
            -Dsonar.sources=.
            -Dsonar.python.version=3.12

      - name: Package Windows Python app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist\runtime | Out-Null
          Copy-Item app.py, serve.py, web.config dist\
          Copy-Item templates, static dist\ -Recurse
          python -m pip install --target dist\site-packages -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency packaging failed' }

          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          $url = "https://www.python.org/ftp/python/$env:PYTHON_RUNTIME_VERSION/python-$env:PYTHON_RUNTIME_VERSION-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expectedHash = 'A93ABE456AB01BD96D7A085B3CDB6566B3063F4241360D114142FBDB07F0A310'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expectedHash) {
            throw 'Python runtime archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath dist\runtime
          Set-Content -Path dist\runtime\python314._pth -Value @('python314.zip', '.', '..', '..\site-packages', 'import site')
          & .\dist\runtime\python.exe -c 'import flask, waitress, app'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Python runtime could not import the app' }

      - name: Sign in to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Windows Web App slot
        shell: pwsh
        run: |
          $platform = az webapp show --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --slot $env:AZURE_SLOT_NAME --query reserved --output tsv
          if ($LASTEXITCODE -ne 0) { throw 'Azure Web App slot lookup failed' }
          if ($platform.Trim().ToLowerInvariant() -ne 'false') { throw 'Target must be a Windows Azure Web App' }

      - name: Deploy to Azure Web App test slot
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: dist
